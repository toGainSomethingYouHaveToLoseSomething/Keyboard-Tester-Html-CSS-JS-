<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Tester | Best Kyeboard Tester | test your keyboard</title>
    <meta name="description" content="Keyboard Tester | Best Kyeboard Tester | test your keyboard">

    <link rel="stylesheet" href="style.css">

    <link rel="icon" type="image/png" href="./images/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./images/favicon.svg" />
    <link rel="shortcut icon" href="./images/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./images/apple-touch-icon.png" />
    <link rel="manifest" href="./images/site.webmanifest" />


    <script src="https://kit.fontawesome.com/9c8a2c40f8.js" crossorigin="anonymous"></script>
</head>

<body >

    <header>
        <nav>
            <ul>
                <li class="logo"><img src="./images/logo.png" alt=""> KeyTest</li>
                <li><a class="active-link" href="#">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="help.html">Help</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="head">
            <article>
                <h1>Keyboard <span>Tester</span></h1>
                <p>Test Your Keyboard Keys in real-time. Press any key and see it highlighted below. It works with all
                    types of keyboards (wired, wireles, mechanical, etc..)</p>
            </article>
        </section>

        <section class="keyboard" >
            <div class="keyboard-head">
                <img src="./images/logo.png" alt="">
                <div class="display-box"></div>
                <div class="keyboard-head-btns">
                    <button><i class="fa-solid fa-rotate-left"></i>Reset</button>
                    <!-- <i class="fa-solid fa-volume-xmark"></i> -->
                    <button><i class="fa-solid fa-volume"></i></button>
                </div>
            </div>

            <div class="keyboard-body">
                <div class="keys">
                    <div class="fun-keys">
                        <div><button class="esc">Esc</button></div>
                        <div><button class="f1">F1</button><button class="f2">F2</button><button class="f3">F3</button><button class="f4">F4</button></div>
                        <div><button class="f5">F5</button><button class="f6">F6</button><button class="f7">F7</button><button class="f8">F8</button></div>
                        <div><button class="f9">F9</button><button class="f10">F10</button><button class="f11">F11</button><button class="f12">F12</button></div>
                    </div>
                    <div class="digit-keys">
                        <button class="backtic normal">~<br>`</button>
                        <button class="dig-one normal">!<br>1</button>
                        <button class="dig-two normal">@<br>2</button>
                        <button class="dig-three normal">#<br>3</button>
                        <button class="dig-four normal">$<br>4</button>
                        <button class="dig-five normal">%<br>5</button>
                        <button class="dig-six normal">^<br>6</button>
                        <button class="dig-seven normal">&<br>7</button>
                        <button class="dig-eight normal">*<br>8</button>
                        <button class="dig-nine normal">&#40<br>9</button>
                        <button class="dig-zero normal">&#41<br>0</button>
                        <button class="dig-minus normal">_<br>-</button>
                        <button class="dig-backspace"><i class="fa-solid fa-arrow-left-long"></i></button>
                    </div>
                    <div class="key-row-one">
                        <button class="tab">Tab</button>
                        <button class="Q normal">Q</button>
                        <button class="W normal">W</button>
                        <button class="E normal">E</button>
                        <button class="R normal">R</button>
                        <button class="T normal">T</button>
                        <button class="Y normal">Y</button>
                        <button class="U normal">U</button>
                        <button class="I normal">I</button>
                        <button class="O normal">O</button>
                        <button class="P normal">P</button>
                        <button class="P normal">&#123<br>&#91</button>
                        <button class="P normal">&#125<br>&#93</button>
                        <button class="P normal">|<br>\</button>
                        
                    </div>
                    <div class="key-row-two">
                        <button class="caps-lock">Caps Lock</button>
                        <button class="A normal">A</button>
                        <button class="S normal">S</button>
                        <button class="D normal">D</button>
                        <button class="F normal">F</button>
                        <button class="G normal">G</button>
                        <button class="H normal">H</button>
                        <button class="J normal">J</button>
                        <button class="K normal">K</button>
                        <button class="L normal">L</button>
                        <button class="colon normal">;<br>:</button>
                        <button class="qoutation normal">&quot<br>&#39</button>
                        <button class="key-enter">Enter</button>
                    </div>
                    <div class="key-row-three">
                        <button class="left-shift"><i class="fa-solid fa-arrow-up"></i>Shift</button>
                        <button class="Z normal">Z</button>
                        <button class="X normal">X</button>
                        <button class="C normal">C</button>
                        <button class="V normal">V</button>
                        <button class="B normal">B</button>
                        <button class="N normal">N</button>
                        <button class="M normal">M</button>
                        <button class="comma normal">&lt<br>,</button>
                        <button class="fullstop normal">&gt<br>.</button>
                        <button class="question normal">?<br>/</button>
                        <button class="right-shift"><i class="fa-solid fa-arrow-up"></i>Shift</button>
                    </div>
                    <div class="last-row">
                        <button class="ctrl-left normal">Ctrl</button>
                        <button class="meta-left normal"><i class="fa-brands fa-microsoft"></i></button>
                        <button class="alt-left normal">Alt</button>
                        <button class="space"></button>
                        <button class="alt-right normal">Alt</button>
                        <button class="meta-rigt normal"><i class="fa-brands fa-microsoft"></i></button>
                        <button class="context-menu normal"><i class="fa-solid fa-bars-staggered"></i></button>
                        <button class="ctrl-right normal">Ctrl</button>
                    </div>

                </div>
                <div class="arrows">
                    <div class="upper">
                        <button style="grid-area: upper-one;" class="prtSc-SysRq">PrtSc<br>SysRq</button>
                        <button style="grid-area: upper-two;" class="Scroll-lock">Scroll<br>Lock</button>
                        <button style="grid-area: upper-three;" class="pause-break">Paus <br>Break</button>
                        <button style="grid-area: upper-four;" class="insert">Insert</button>
                        <button style="grid-area: upper-five;" class="Home-btn">Home</button>
                        <button style="grid-area: upper-six;" class="Page-up">Page<br>Up</button>
                        <button style="grid-area: upper-seven;" class="delete">Delete</button>
                        <button style="grid-area: upper-eight;" class="end">End</button>
                        <button style="grid-area: upper-nine;" class="page-down">Page<br>Down</button>
                    </div>
                    <div class="lower">
                        <div style="grid-area: lower-div1;"></div><button class="arrow-up" style="grid-area: arrow-up;"><i class="fa-solid fa-arrow-up"></i></button><div style="grid-area: lower-div2;"></div>
                        <button class="arrow-left" style="grid-area: arrow-left;"><i class="fa-solid fa-arrow-left"></i></i></button>
                        <button class="arrow-down" style="grid-area: arrow-down;"><i class="fa-solid fa-arrow-down"></i></button>
                        <button class="arrow-right" style="grid-area: arrow-right;"><i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                </div>
                <div class="nums">
                    <div style="grid-area: numpad-div;"></div>
                    <button class="Num-Lock" style="grid-area: Num-Lock;">Num<br>Lock</button>
                    <button class="forward-slash" style="grid-area: nupdad-forward-slash;">/</button>
                    <button class="asterisk" style="grid-area: numpad-asterisk;">*</button>
                    <button class="numpad-minus" style="grid-area: numpad-minus;">-</button>
                    <button class="numpad-seven" style="grid-area: numpad-seven;">7<br></button>
                    <button class="numpad-eight" style="grid-area: numpad-eight;">8</button>
                    <button class="numpad-nine" style="grid-area: numpad-nine;">9</button>
                    <button class="numpad-plus" style="grid-area: numpad-plus;">+</button>
                    <button class="numpad-four" style="grid-area: numpad-four;">4</button>
                    <button class="numpad-five" style="grid-area: numpad-five;">5</button>
                    <button class="numpad-six" style="grid-area: numpad-six;">6</button>
                    <button class="numpad-one" style="grid-area: numpad-one;">1</button>
                    <button class="numpad-two" style="grid-area: numpad-two;">2</button>
                    <button class="numpad-three" style="grid-area: numpad-three;">3</button>
                    <button class="numpad-enter" style="grid-area: numpad-enter;">Enter</button>
                    <button class="numpad-zero" style="grid-area: numpad-zero;">0</button>
                    <button class="numpad-decimal" style="grid-area: numpad-decimal;">.</button>
                </div>
            </div>
        </section>

        <footer>

        </footer>

    </main>


    <script src="script.js"></script>
</body>

</html>
